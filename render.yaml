services:
  - type: web
    name: pranox-ai
    runtime: python
    buildCommand: "apt-get install -y tesseract-ocr && pip install -r requirements.txt"
    startCommand: "gunicorn app:app --workers 1 --threads 4 --worker-class gthread --timeout 120 --keep-alive 5"
    envVars:
      - key: FLASK_ENV
        value: production
