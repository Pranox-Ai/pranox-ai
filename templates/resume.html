{% extends "base.html" %}
{% block content %}

<style>
.form-container {
    max-width: 700px;
    margin: 60px auto;
    padding: 30px;
    background: rgba(17, 24, 39, 0.7);
    border-radius: 16px;
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}

.input-group {
    margin-bottom: 20px;
}

.input-group label {
    display: block;
    margin-bottom: 6px;
    color: #cbd5f5;
}

.input-group input,
.input-group textarea {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #1f2937;
    background: #020617;
    color: white;
    outline: none;
}

.input-group input:focus,
.input-group textarea:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 2px rgba(99,102,241,0.3);
}

.submit-btn {
    padding: 12px 20px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(90deg, #6366f1, #ec4899);
    color: white;
    cursor: pointer;
    font-weight: 600;
    transition: 0.3s;
}

.submit-btn:hover {
    transform: scale(1.05);
    opacity: 0.95;
}

.output-box {
    background: #020617;
    padding: 20px;
    border-radius: 10px;
    margin-top: 20px;
    white-space: pre-wrap;
}
</style>

<div class="form-container">

<h2>Resume Builder</h2>

<form method="POST">

    <div class="input-group">
        <label>Full Name</label>
        <input type="text" name="name" required>
    </div>

    <div class="input-group">
        <label>Role</label>
        <input type="text" name="role" required>
    </div>

    <div class="input-group">
        <label>Skills</label>
        <textarea name="skills" required></textarea>
    </div>

    <div class="input-group">
        <label>Experience</label>
        <textarea name="experience"></textarea>
    </div>

    <div class="input-group">
        <label>Education</label>
        <textarea name="education" required></textarea>
    </div>

    <button class="submit-btn">Generate Resume</button>

</form>

{% if resume %}
<h3>Output</h3>

<pre class="output-box" id="resumeText">{{ resume }}</pre>

<div style="margin-top:15px; display:flex; gap:10px;">
    
    <!-- COPY BUTTON -->
    <button onclick="copyResume()" class="submit-btn">
        📋 Copy
    </button>

    <!-- DOWNLOAD PDF -->
    <form method="POST" action="/download_resume">
        <input type="hidden" name="resume" id="resumeHidden">
        <button class="submit-btn">
            📄 Download PDF
        </button>
    </form>

</div>
{% endif %}
<script>
function copyResume(){
    const text = document.getElementById("resumeText").innerText;
    navigator.clipboard.writeText(text);
    alert("Copied!");
}

// 🔥 Important for PDF download
document.addEventListener("DOMContentLoaded", function(){
    const resumeEl = document.getElementById("resumeText");
    const hiddenInput = document.getElementById("resumeHidden");

    if(resumeEl && hiddenInput){
        hiddenInput.value = resumeEl.innerText;
    }
});
</script>

</div>

{% endblock %}
