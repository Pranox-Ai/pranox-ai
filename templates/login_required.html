<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Required</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top, rgba(99, 102, 241, 0.25), transparent 35%),
                linear-gradient(135deg, #020617, #0f172a);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            background: rgba(15, 23, 42, 0.78);
            border: 1px solid rgba(148, 163, 184, 0.2);
            backdrop-filter: blur(18px);
            border-radius: 24px;
            padding: 42px 34px;
            text-align: center;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
            animation: fadeIn 0.6s ease-in-out;
        }

        .icon-box {
            width: 78px;
            height: 78px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            box-shadow: 0 12px 35px rgba(99, 102, 241, 0.45);
        }

        h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        p {
            color: #cbd5e1;
            font-size: 15.5px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .login-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 22px;
            border-radius: 14px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.25s ease;
            box-shadow: 0 12px 30px rgba(79, 70, 229, 0.35);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 40px rgba(79, 70, 229, 0.5);
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .note {
            margin-top: 22px;
            font-size: 13px;
            color: #94a3b8;
        }

        .brand {
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #818cf8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 34px 24px;
                border-radius: 20px;
            }

            h2 {
                font-size: 24px;
            }

            p {
                font-size: 14.5px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="brand">Secure Access</div>

        <div class="icon-box">
            🔒
        </div>

        <h2>Login Required</h2>

        <p>
            Please sign in with your Google account to continue using this feature securely.
        </p>

        <a href="/login" class="login-btn">
            Continue with Google
        </a>

        <div class="note">
            Your account helps us keep your data safe and personalized.
        </div>
    </div>

</body>
</html>
