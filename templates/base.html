<style>

body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg,#020617,#0f172a);
    color: white;
}

/* NAVBAR */
.navbar {
    background: #020617;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #1f2937;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: #a2a2a2;
}

.menu-toggle{
display:none;
font-size:22px;
cursor:pointer;
}

.nav-links {
display:flex;
}

.nav-links a {
    color: #415ebe;
    margin-left: 20px;
    text-decoration: none;
    font-size: 14px;
}

.nav-links a:hover {
    color: white;
}

/* CONTAINER */
.container {
width:100%;
padding:10px;
}

/* FORM */
input, textarea, select {
    width: 100%;
    padding: 14px;
    margin-bottom: 18px;
    background: #1f2937;
    border: none;
    color: white;
    border-radius: 8px;
}

button {
    background: linear-gradient(90deg,#074084,#074084);
    border: none;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    width: 50%;
}

.output-box {
    background: #020617;
    padding: 20px;
    border-radius: 12px;
    margin-top: 20px;
    white-space: pre-wrap;
    border: 1px solid #bcbcbc;
}

/* MOBILE FIX */
@media(max-width:768px){

.menu-toggle{
display:block;
}

.nav-links{
display:none;
flex-direction:column;
width:100%;
background:#020617;
margin-top:10px;
padding:10px;
}

.nav-links.active{
display:flex;
}

.nav-links a{
margin:10px 0;
}

}

</style>
</head>

<body>

<div class="navbar">
    <div class="logo">PRANOX AI</div>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <div class="nav-links" id="navLinks">
        <a href="/dashboard">Dashboard</a>
        <a href="/email">Email</a>
        <a href="/resume">Resume</a>
        <a href="/chat">AI Chat</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<script>
function toggleMenu(){
    document.getElementById("navLinks").classList.toggle("active");
}
</script>

<div class="container">
{% block content %}{% endblock %}
</div>

<footer style="text-align:center;padding:20px;color:#888;">
© 2026 Pranox AI • 
<a href="/privacy">Privacy</a> • 
<a href="/terms">Terms</a>
</footer>

</body>
</html>
