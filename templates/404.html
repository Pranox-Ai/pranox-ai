<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found · Pranox AI</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<meta name="theme-color" content="#020617">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#020617,#0f172a);color:white;min-height:100vh;display:flex;flex-direction:column;}

/* NAVBAR */
.navbar{background:#020617;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1f2937;}
.logo{font-size:18px;font-weight:700;color:#a2a2a2;text-decoration:none;}
.nav-links a{color:#415ebe;margin-left:20px;text-decoration:none;font-size:14px;}
.nav-links a:hover{color:white;}

/* AMBIENT */
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:0.07;pointer-events:none;}
.orb-1{width:500px;height:500px;background:#6366f1;top:-100px;left:-100px;}
.orb-2{width:400px;height:400px;background:#ec4899;bottom:-100px;right:-100px;}

/* MAIN */
.page{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;position:relative;z-index:1;}

.error-code{font-size:120px;font-weight:800;line-height:1;background:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;}
.error-title{font-size:26px;font-weight:700;color:#e2e8f0;margin-bottom:12px;}
.error-desc{font-size:15px;color:#6b7280;max-width:420px;line-height:1.6;margin-bottom:36px;}

.btn-group{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;padding:12px 28px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:opacity .2s;}
.btn-primary:hover{opacity:.85;}
.btn-secondary{background:transparent;color:#94a3b8;padding:12px 28px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:500;border:1px solid #1f2937;transition:all .2s;}
.btn-secondary:hover{border-color:#374151;color:white;}

.suggestions{margin-top:52px;padding:24px 32px;background:rgba(13,18,30,0.8);border:1px solid #1f2937;border-radius:14px;max-width:420px;text-align:left;}
.suggestions-title{font-size:12px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px;}
.suggestion-link{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #1f2937;text-decoration:none;color:#94a3b8;font-size:14px;transition:color .2s;}
.suggestion-link:last-child{border-bottom:none;}
.suggestion-link:hover{color:#e2e8f0;}
.suggestion-icon{font-size:16px;}

/* FOOTER */
footer{text-align:center;padding:20px;color:#374151;font-size:13px;}
footer a{color:#415ebe;text-decoration:none;}
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<nav class="navbar">
  <a class="logo" href="/">PRANOX AI</a>
  <div class="nav-links">
    <a href="/dashboard">Dashboard</a>
    <a href="/chat">AI Chat</a>
    <a href="/deepsearch">Research</a>
  </div>
</nav>

<div class="page">
  <div class="error-code">404</div>
  <div class="error-title">Page not found</div>
  <div class="error-desc">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</div>

  <div class="btn-group">
    <a href="/" class="btn-primary">Go home</a>
    <a href="javascript:history.back()" class="btn-secondary">Go back</a>
  </div>

  <div class="suggestions">
    <div class="suggestions-title">You might be looking for</div>
    <a href="/chat" class="suggestion-link"><span class="suggestion-icon">🤖</span> AI Chat</a>
    <a href="/deepsearch" class="suggestion-link"><span class="suggestion-icon">🔎</span> Deep Research</a>
    <a href="/email" class="suggestion-link"><span class="suggestion-icon">✉️</span> Email Writer</a>
    <a href="/resume" class="suggestion-link"><span class="suggestion-icon">📄</span> Resume Builder</a>
    <a href="/dashboard" class="suggestion-link"><span class="suggestion-icon">🏠</span> Dashboard</a>
  </div>
</div>

<footer>
  © 2026 Pranox AI •
  <a href="/privacy">Privacy</a> •
  <a href="/terms">Terms</a>
</footer>

</body>
</html>
