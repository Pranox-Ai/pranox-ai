{% extends "base.html" %}
{% block content %}

<style>
.form-container {
    max-width: 700px;
    margin: 60px auto;
    padding: 30px;
    background: rgba(17, 24, 39, 0.7);
    border-radius: 16px;
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}

.input-group {
    margin-bottom: 20px;
}

.input-group label {
    display: block;
    margin-bottom: 6px;
    color: #cbd5f5;
    font-size: 14px;
}

.input-group textarea,
.input-group select {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #1f2937;
    background: #020617;
    color: white;
    outline: none;
}

.input-group textarea:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 2px rgba(99,102,241,0.3);
}

.submit-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(90deg,#6366f1,#ec4899);
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.output-box {
    background: #020617;
    padding: 20px;
    border-radius: 10px;
    margin-top: 20px;
    white-space: pre-wrap;
}
</style>

<div class="form-container">

<h2>Email Generator</h2>

<form method="POST">

    <div class="input-group">
        <label>Email Topic</label>
        <textarea name="topic" rows="5" placeholder="Enter email topic..." required></textarea>
    </div>

    <div class="input-group">
        <label>Tone</label>
        <select name="tone">
            <option>Professional</option>
            <option>Friendly</option>
            <option>Formal</option>
        </select>
    </div>

    <button class="submit-btn">Generate Email</button>

</form>

{% if email %}
<h3>Output</h3>
<pre class="output-box" id="outputText">{{ email }}</pre>
<button onclick="copyText()">Copy</button>
{% endif %}

</div>

<script>
function copyText(){
  const el = document.getElementById("outputText");
  if(!el){
    alert("Nothing to copy!");
    return;
  }
  navigator.clipboard.writeText(el.innerText);
  alert("Copied!");
}
</script>

{% endblock %}
