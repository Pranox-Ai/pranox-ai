{% extends "base.html" %}
{% block content %}

<div class="chat-layout">

<div class="sidebar">
<h2>Pranox</h2>
<button onclick="newChat()" class="newchat">+ New Chat</button>
<div id="history"></div>
</div>

<div class="chat-main">

<div id="messages"></div>

<div class="input-area">

<label for="fileUpload" class="icon-btn">+</label>
<input type="file" id="fileUpload" style="display:none">

<input id="messageInput" placeholder="Message Pranox...">

<button onclick="startVoice()" class="voice-btn">🎤</button>

<button id="sendBtn">➤</button>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>

// 🔥 MARKDOWN FIX (IMPORTANT)
marked.setOptions({
  breaks: true,
  gfm: true
})

// 🔥 FINAL FORMATTER (LIKE CHATGPT)
function formatText(text){

    let html = marked.parse(text)

    // REMOVE PARAGRAPH TAG GAPS
    html = html.replace(/<p>/g,"")
    html = html.replace(/<\/p>/g,"<br>")

    // REMOVE EXTRA BREAKS
    html = html.replace(/(<br>\s*){3,}/g,"<br><br>")

    return html
}

const messages=document.getElementById("messages")
const input=document.getElementById("messageInput")
const sendBtn=document.getElementById("sendBtn")
const historyDiv=document.getElementById("history")
const fileUpload=document.getElementById("fileUpload")

let attachedFile=null
let lastUserMessage=""

let chats=JSON.parse(localStorage.getItem("pranoxChats")||"[]")
let currentChat=[]

function saveChats(){
localStorage.setItem("pranoxChats",JSON.stringify(chats))
}

function renderHistory(){
historyDiv.innerHTML=""
chats.forEach((chat,index)=>{
let div=document.createElement("div")
div.className="history-item"
div.innerText=chat[0]?.text.slice(0,30) || "Chat"
div.onclick=()=>loadChat(index)
historyDiv.appendChild(div)
})
}

function loadChat(index){
messages.innerHTML=""
currentChat=chats[index]
currentChat.forEach(msg=>{
addMessage(msg.text,msg.type,false)
})
}

function newChat(){
if(currentChat.length>0){
chats.push(currentChat)
saveChats()
}
messages.innerHTML=""
currentChat=[]
renderHistory()
}

// 🔥 MESSAGE ADD FIXED
function addMessage(text,type,save=true){

let buttons=""

if(type==="ai"){
buttons=`
<div class="msg-actions">
<button class="icon-btn" onclick="copyText(this)">📋</button>
<button class="icon-btn" onclick="regenerate()">🔁</button>
</div>`
}

const html = `
<div class="message ${type}">
<div class="bubble">
<div class="msg-text">${formatText(text)}</div>
${buttons}
</div>
</div>`

messages.insertAdjacentHTML("beforeend", html)
messages.scrollTop=messages.scrollHeight

if(save){
currentChat.push({text,type})
}
}

// 🔥 TYPEWRITER FIXED
function typeWriter(text,element){
let i=0

function typing(){
if(i<text.length){
element.innerHTML = formatText(text.substring(0,i+1))
i++
setTimeout(typing,5)
}
}
typing()
}

sendBtn.onclick=sendMessage

input.addEventListener("keypress",e=>{
if(e.key==="Enter") sendMessage()
})

async function sendMessage(){

let text=input.value.trim()
if(!text && !attachedFile) return

lastUserMessage=text
addMessage(text,"user")
input.value=""

// THINKING UI
let typing=document.createElement("div")
typing.className="message ai"
typing.innerHTML=`<div class="bubble"><div class="msg-text typing">⚡ Thinking...</div></div>`

messages.appendChild(typing)
messages.scrollTop=messages.scrollHeight

let reply=""

try{

if(attachedFile){
let form=new FormData()
form.append("file",attachedFile)
form.append("message",text)

let res=await fetch("/api/upload",{method:"POST",body:form})
let data=await res.json()
reply=data.reply
attachedFile=null
}else{

let res=await fetch("/api/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message:text})
})

let data=await res.json()
reply=data.reply
}

}catch{
reply="⚠️ Error generating response"
}

typing.remove()

messages.insertAdjacentHTML("beforeend",`
<div class="message ai">
<div class="bubble">
<div class="msg-text"></div>
<div class="msg-actions">
<button class="icon-btn" onclick="copyText(this)">📋</button>
<button class="icon-btn" onclick="regenerate()">🔁</button>
</div>
</div>
</div>`)

let aiText=document.querySelectorAll(".msg-text")
aiText=aiText[aiText.length-1]

typeWriter(reply,aiText)

currentChat.push({text:reply,type:"ai"})
saveChats()
renderHistory()
}

// COPY
function copyText(btn){
let text=btn.closest(".bubble").querySelector(".msg-text").innerText
navigator.clipboard.writeText(text)
btn.innerText="✔"
setTimeout(()=>{btn.innerText="📋"},1500)
}

// REGENERATE
function regenerate(){
input.value=lastUserMessage
sendMessage()
}

// VOICE
function startVoice(){
let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if(!SpeechRecognition){
alert("Use Chrome + allow mic permission");
return;
}

const recognition = new SpeechRecognition();
recognition.lang="en-IN";

const btn = document.querySelector(".voice-btn");

recognition.onstart = ()=>{
btn.innerText="🎙️"
btn.style.background="#ef4444"
}

recognition.onend = ()=>{
btn.innerText="🎤"
btn.style.background="#10b981"
}

recognition.onresult = (event)=>{
input.value = event.results[0][0].transcript;
};

recognition.start();
}

fileUpload.onchange=function(){
attachedFile=fileUpload.files[0]
addMessage("📎 "+attachedFile.name+" attached","user")
}

renderHistory()

</script>

<style>

/* LAYOUT */
.chat-layout{
display:flex;
height:calc(100vh - 80px);
background:#0f172a;
}

.sidebar{
width:260px;
background:#020617;
padding:20px;
border-right:1px solid #1f2937;
}

.chat-main{
flex:1;
display:flex;
flex-direction:column;
}

#messages{
flex:1;
overflow-y:auto;
padding:20px;
}

/* MESSAGE */
.message{
display:flex;
margin-bottom:20px;
}

.user{justify-content:flex-end}
.ai{justify-content:flex-start}

/* 🔥 TEXT FIX (CRITICAL) */
.msg-text{
font-size:18px;
line-height:1.6;
white-space:pre-wrap;
}

.msg-text p{
margin:0;
}

.msg-text ul{
padding-left:20px;
margin:8px 0;
}

.msg-text li{
margin-bottom:6px;
}

/* CODE BLOCK */
pre{
background:#020617;
padding:12px;
border-radius:8px;
overflow-x:auto;
margin-top:10px;
}

code{
color:#38bdf8;
}

/* BUBBLE */
.bubble{
max-width:75%;
padding:14px 18px;
border-radius:12px;
}

.user .bubble{
background:linear-gradient(90deg,#2563eb,#3b82f6);
}

.ai .bubble{
background:#111827;
border:1px solid #1f2937;
}

/* ACTIONS */
.msg-actions{
margin-top:6px;
display:flex;
gap:6px;
opacity:0;
}

.bubble:hover .msg-actions{
opacity:1;
}

.icon-btn{
width:28px;
height:28px;
display:flex;
align-items:center;
justify-content:center;
background:#1f2937;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
}

/* INPUT */
.input-area{
display:flex;
gap:10px;
padding:15px;
border-top:1px solid #1f2937;
}

#messageInput{
flex:1;
padding:14px;
background:#1f2937;
border:none;
border-radius:10px;
color:white;
font-size:16px;
}

#sendBtn{
width:45px;
height:45px;
border-radius:50%;
background:#2563eb;
border:none;
color:white;
}

.voice-btn{
width:45px;
height:45px;
border-radius:50%;
background:#10b981;
border:none;
color:white;
}

/* MOBILE */
@media(max-width:768px){
.chat-layout{flex-direction:column;}
.sidebar{display:none;}
.bubble{max-width:90%;}
}

</style>

{% endblock %}
